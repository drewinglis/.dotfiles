# Desktop wallpaper config
# greglook points these at ~/.local/state/wallpaperctl/current.<OUTPUT>, which is
# generated by a `wallpaperctl` tool that is not published in their repo. Using a
# static path instead - drop any image at ~/Pictures/wallpapers/current.png.

preload = ~/Pictures/wallpapers/current.png

wallpaper = HDMI-A-1, ~/Pictures/wallpapers/current.png

splash = false
