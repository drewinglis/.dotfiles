# Lock screen config

general {
    ignore_empty_input = true
    grace = 3
    hide_cursor = true
}

background {
    monitor = HDMI-A-1
    path = ~/Pictures/wallpapers/current.png

    blur_passes = 3
    blur_size = 3
}

# Clock
label {
    monitor = HDMI-A-1
    position = 0, 160
    halign = center
    valign = center

    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_family = FiraCode Nerd Font
    font_size = 85

    shadow_passes = 5
    shadow_size = 10
}

# Password input field
input-field {
    monitor = HDMI-A-1
    position = 0, -50
    halign = center
    valign = center

    size = 400, 50
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(151515)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)

    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>password...</i>
    hide_input = false

    rounding = -1

    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
}
